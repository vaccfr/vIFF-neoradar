# yaml-language-server: $schema=https://raw.githubusercontent.com/neoradar-project/schemas/main/systems/lists.schema.json
# Example start-up list using the vIFF CDM plugin's items, in the CDM plugin's usual column order.
# Host items (STS, SID, RWY, CFL, ASSR, ...) are omitted; add them from your own package.
---
- name: CDM START-UP
  filterExpressions: ["==", "plugin:vIFF CDM:EXP_Listed", "1"]
  columns:
    - name: C/S
      widthChars: 8
      tagItem:
        itemName: callsign
        textAlign: left
    - name: BY
      widthChars: 2
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_BY"
    - name: DEICE
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_DEICE"
        leftClick: "plugin:vIFF CDM:ACTION_DEICE Menu"
    - name: TTG
      widthChars: 3
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TTG"
    - name: E/TOBT
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TOBT"
        leftClick: "plugin:vIFF CDM:ACTION_TOBT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_TOBT Menu"
    - name: TSAT
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TSAT"
    - name: ASAT
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_ASAT"
    - name: TTOT
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TTOT"
        leftClick: "plugin:vIFF CDM:ACTION_TTOT Menu"
    - name: CTOT
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
        leftClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
    - name: ETFMS
      widthChars: 7
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_ETFMS"
        leftClick: "plugin:vIFF CDM:ACTION_ETFMS Menu"
    - name: MSG
      widthChars: 3
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_MSG"
    - name: RDY
      widthChars: 3
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_RDY"
        leftClick: "plugin:vIFF CDM:ACTION_RDY"
        rightClick: "plugin:vIFF CDM:ACTION_RDY REA"
    - name: ASRT
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_ASRT"

# Compact lists for small screens. EXP_Stage splits the departures: "now" (start-up within 10
# minutes, ready, suspended or expired), "started" (start-up approved, still on the ground) and
# "later". TIME names the time that matters; TIME S names it with one letter (B TOBT, S TSAT,
# T TTOT, E EOBT); SEQ is the take-off order, so sorting by it gives the departure sequence.
- name: CDM NOW
  filterExpressions:
    ["OR", [["==", "plugin:vIFF CDM:EXP_Stage", "now"], ["==", "plugin:vIFF CDM:EXP_Stage", "started"]]]
  columns:
    - name: "#"
      widthChars: 2
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_SEQ"
    - name: C/S
      widthChars: 8
      tagItem:
        itemName: callsign
        textAlign: left
    - name: TIME
      widthChars: 9
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TIME"
        textAlign: left
        leftClick: "plugin:vIFF CDM:ACTION_TOBT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CDM Menu"
    - name: CTOT
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
        leftClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
    - name: STS
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_STATUS"
        leftClick: "plugin:vIFF CDM:ACTION_RDY"
        rightClick: "plugin:vIFF CDM:ACTION_RDY REA"

- name: CDM LATER
  filterExpressions: ["==", "plugin:vIFF CDM:EXP_Stage", "later"]
  columns:
    - name: "#"
      widthChars: 2
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_SEQ"
    - name: C/S
      widthChars: 8
      tagItem:
        itemName: callsign
        textAlign: left
    - name: TIME
      widthChars: 9
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TIME"
        textAlign: left
        leftClick: "plugin:vIFF CDM:ACTION_TOBT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CDM Menu"
    - name: CTOT
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
        leftClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
    - name: STS
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_STATUS"
        leftClick: "plugin:vIFF CDM:ACTION_RDY"
        rightClick: "plugin:vIFF CDM:ACTION_RDY REA"

- name: CDM TOPDOWN
  filterExpressions:
    ["OR", [["==", "plugin:vIFF CDM:EXP_Stage", "now"], ["==", "plugin:vIFF CDM:EXP_Stage", "started"]]]
  columns:
    - name: "#"
      widthChars: 2
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_SEQ"
    - name: C/S
      widthChars: 8
      tagItem:
        itemName: callsign
        textAlign: left
    - name: TIME
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TIME S"
        textAlign: left
        leftClick: "plugin:vIFF CDM:ACTION_CDM Menu"
    - name: CTOT
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
    - name: STS
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_STATUS"
        leftClick: "plugin:vIFF CDM:ACTION_RDY"
